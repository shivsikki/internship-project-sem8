<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#87CEEB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E0F6FF;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="building" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f8f9fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e9ecef;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Sky -->
  <rect width="400" height="300" fill="url(#sky)"/>
  
  <!-- Ground -->
  <rect x="0" y="250" width="400" height="50" fill="#90EE90"/>
  
  <!-- Main Hospital Building -->
  <rect x="100" y="100" width="200" height="150" fill="url(#building)" stroke="#dee2e6" stroke-width="2"/>
  
  <!-- Windows -->
  <rect x="120" y="120" width="30" height="25" fill="#4ecdc4" stroke="#333" stroke-width="1"/>
  <rect x="160" y="120" width="30" height="25" fill="#4ecdc4" stroke="#333" stroke-width="1"/>
  <rect x="200" y="120" width="30" height="25" fill="#4ecdc4" stroke="#333" stroke-width="1"/>
  <rect x="240" y="120" width="30" height="25" fill="#4ecdc4" stroke="#333" stroke-width="1"/>
  
  <rect x="120" y="160" width="30" height="25" fill="#4ecdc4" stroke="#333" stroke-width="1"/>
  <rect x="160" y="160" width="30" height="25" fill="#4ecdc4" stroke="#333" stroke-width="1"/>
  <rect x="200" y="160" width="30" height="25" fill="#4ecdc4" stroke="#333" stroke-width="1"/>
  <rect x="240" y="160" width="30" height="25" fill="#4ecdc4" stroke="#333" stroke-width="1"/>
  
  <rect x="120" y="200" width="30" height="25" fill="#4ecdc4" stroke="#333" stroke-width="1"/>
  <rect x="160" y="200" width="30" height="25" fill="#4ecdc4" stroke="#333" stroke-width="1"/>
  <rect x="200" y="200" width="30" height="25" fill="#4ecdc4" stroke="#333" stroke-width="1"/>
  <rect x="240" y="200" width="30" height="25" fill="#4ecdc4" stroke="#333" stroke-width="1"/>
  
  <!-- Main Entrance -->
  <rect x="180" y="230" width="40" height="20" fill="#495057" stroke="#333" stroke-width="1"/>
  
  <!-- Hospital Sign -->
  <rect x="150" y="80" width="100" height="20" fill="#667eea" rx="10"/>
  <text x="200" y="95" text-anchor="middle" fill="white" font-family="Arial" font-size="12" font-weight="bold">MEDICENTER AI</text>
  
  <!-- Red Cross on Roof -->
  <rect x="195" y="60" width="10" height="30" fill="#ff6b6b"/>
  <rect x="185" y="70" width="30" height="10" fill="#ff6b6b"/>
  
  <!-- Trees -->
  <circle cx="50" cy="240" r="20" fill="#228B22"/>
  <rect x="45" y="240" width="10" height="30" fill="#8B4513"/>
  
  <circle cx="350" cy="240" r="20" fill="#228B22"/>
  <rect x="345" y="240" width="10" height="30" fill="#8B4513"/>
  
  <!-- Clouds -->
  <ellipse cx="80" cy="50" rx="25" ry="15" fill="white" opacity="0.8"/>
  <ellipse cx="320" cy="40" rx="30" ry="18" fill="white" opacity="0.8"/>
</svg>
